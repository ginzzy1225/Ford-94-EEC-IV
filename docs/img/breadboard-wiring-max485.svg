<text class="th" x="140" y="430" text-anchor="end" fill="#712B13">DATA</text>
<text class="ts" x="140" y="448" text-anchor="end" fill="#993C1D">tan/orange 914</text>
<text class="th" x="140" y="480" text-anchor="end" fill="#712B13">DATA</text>
<text class="ts" x="140" y="498" text-anchor="end" fill="#993C1D">pink/lt blue 915</text>
<text class="ts" x="530" y="436" fill="#085041">D8</text>
<text class="ts" x="530" y="462" fill="#085041">D9</text>
<text class="ts" x="530" y="488" fill="#085041">D7</text>
<text class="ts" x="530" y="514" fill="#085041">GND</text>
<text class="ts" x="40" y="555" fill="#5F5E5A">Dot = pin 1 on each PC817. All GND points join on the blue rail; both red rails are 5V.</text>
<text class="ts" x="40" y="575" fill="#5F5E5A">Data wires: measure 0–5 V on each before connecting. A/B polarity unknown; swap if silent.</text>
</svg>
