<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Breadboard wiring for the EEC-IV code reader</title>
<desc>Motorhome wires STO, SIG RTN and STI on the left connect through two PC817 optocouplers, a diode and three resistors to an Arduino Nano on the right.</desc>
<style>
.th{font-size:14px;font-weight:600;dominant-baseline:central}
.ts{font-size:12px;dominant-baseline:central}
.w{fill:none;stroke:#888780;stroke-width:1.5}
</style>
<rect x="0" y="0" width="680" height="430" fill="#ffffff"/>
<line x1="250" y1="60" x2="500" y2="60" stroke="#E24B4A" stroke-width="3"/>
<text class="ts" x="240" y="60" text-anchor="end" fill="#5F5E5A">5V rail</text>
<path class="w" d="M520 120 L500 120 L500 60"/>
<path class="w" d="M300 145 L270 145 L270 127"/>
<path class="w" d="M270 93 L270 60"/>
<path class="w" d="M300 175 L242 175"/>
<path class="w" d="M206 175 L150 175"/>
<path class="w" d="M380 145 L520 145"/>
<path class="w" d="M380 175 L520 175"/>
<path class="w" d="M150 280 L300 280"/>
<path class="w" d="M276 280 L276 238 L400 238 L400 280"/>
<path class="w" d="M380 280 L520 280"/>
<path class="w" d="M300 320 L252 320"/>
<path class="w" d="M198 320 L150 320"/>
<path class="w" d="M380 320 L428 320"/>
<path class="w" d="M482 320 L520 320"/>
<rect x="262" y="93" width="16" height="34" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text class="ts" x="256" y="110" text-anchor="end" fill="#5F5E5A">470 Ω</text>
<polygon points="242,165 242,185 212,175" fill="#888780"/>
<line x1="208" y1="164" x2="208" y2="186" stroke="#888780" stroke-width="3"/>
<text class="ts" x="226" y="202" text-anchor="middle" fill="#5F5E5A">1N4148, band to STO</text>
<rect x="300" y="125" width="80" height="70" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text class="th" x="340" y="152" text-anchor="middle" fill="#2C2C2A">U1</text>
<text class="ts" x="340" y="170" text-anchor="middle" fill="#5F5E5A">PC817</text>
<text class="ts" x="309" y="145" text-anchor="middle" fill="#444441">1</text>
<text class="ts" x="309" y="177" text-anchor="middle" fill="#444441">2</text>
<text class="ts" x="371" y="145" text-anchor="middle" fill="#444441">4</text>
<text class="ts" x="371" y="177" text-anchor="middle" fill="#444441">3</text>
<circle cx="309" cy="132" r="3" fill="#5F5E5A"/>
<text class="ts" x="338" y="230" text-anchor="middle" fill="#5F5E5A">ground tie</text>
<rect x="300" y="260" width="80" height="80" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text class="th" x="340" y="292" text-anchor="middle" fill="#2C2C2A">U2</text>
<text class="ts" x="340" y="310" text-anchor="middle" fill="#5F5E5A">PC817</text>
<text class="ts" x="309" y="280" text-anchor="middle" fill="#444441">3</text>
<text class="ts" x="309" y="320" text-anchor="middle" fill="#444441">4</text>
<text class="ts" x="371" y="280" text-anchor="middle" fill="#444441">2</text>
<text class="ts" x="371" y="320" text-anchor="middle" fill="#444441">1</text>
<circle cx="371" cy="332" r="3" fill="#5F5E5A"/>
<rect x="198" y="312" width="54" height="16" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text class="ts" x="225" y="302" text-anchor="middle" fill="#5F5E5A">470 Ω</text>
<rect x="428" y="312" width="54" height="16" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text class="ts" x="455" y="302" text-anchor="middle" fill="#5F5E5A">1 kΩ</text>
<rect x="30" y="140" width="120" height="210" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text class="th" x="90" y="158" text-anchor="middle" fill="#712B13">To motorhome</text>
<text class="th" x="140" y="175" text-anchor="end" fill="#712B13">STO</text>
<text class="ts" x="140" y="193" text-anchor="end" fill="#993C1D">pink/lt green</text>
<text class="th" x="140" y="280" text-anchor="end" fill="#712B13">SIG RTN</text>
<text class="ts" x="140" y="298" text-anchor="end" fill="#993C1D">gray/red</text>
<text class="th" x="140" y="320" text-anchor="end" fill="#712B13">STI</text>
<text class="ts" x="140" y="338" text-anchor="end" fill="#993C1D">white/purple</text>
<rect x="520" y="95" width="120" height="255" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text class="th" x="580" y="230" text-anchor="middle" fill="#085041">Nano</text>
<text class="ts" x="580" y="248" text-anchor="middle" fill="#0F6E56">to laptop</text>
<text class="ts" x="530" y="120" fill="#085041">5V</text>
<text class="ts" x="530" y="145" fill="#085041">D2</text>
<text class="ts" x="530" y="175" fill="#085041">GND</text>
<text class="ts" x="530" y="280" fill="#085041">GND</text>
<text class="ts" x="530" y="320" fill="#085041">D3</text>
<text class="ts" x="40" y="385" fill="#5F5E5A">Dot = pin 1 on each PC817. U2 sits turned around (pin 1 at bottom right).</text>
<text class="ts" x="40" y="405" fill="#5F5E5A">Both GND wires can go to the same Nano GND pin. Wire colors are the 1994 pickup's.</text>
</svg>
